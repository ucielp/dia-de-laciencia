<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Hojas ADN secreto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;700&display=swap">
<style>
/* Una hoja por niño: tarjeta «Mi ADN secreto» + nombre + marco para pegar el perro.
   2 hojas A5 por A4 apaisado, con línea de corte. Opción ?relleno=1: imprime el punto de color en vez del aro para el gomet. */
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#ecebe6}
body{font-family:"Nunito Sans",sans-serif;color:#1F2A44}
.sheet{width:297mm;height:210mm;background:#fff;display:flex;position:relative;overflow:hidden;margin:8mm auto;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.cutline{position:absolute;left:148.5mm;top:0;bottom:0;border-left:0.35mm dashed #b9bec8}
.scis{position:absolute;left:148.5mm;top:4mm;transform:translateX(-50%) rotate(90deg);font-size:13pt;color:#9aa0ab;background:#fff;line-height:1}
.half{width:148.5mm;height:210mm;padding:9mm 10mm 8mm;display:flex;flex-direction:column;gap:4mm;position:relative}
.half.empty{visibility:hidden}

/* Tarjeta ADN */
.card{border:0.7mm solid #1F2A44;border-radius:5mm;padding:3mm 5mm 3.5mm;display:flex;flex-direction:column;gap:2mm;background:#fff}
.ct{display:flex;align-items:center;justify-content:space-between}
.ct b{font-family:Fredoka;font-weight:700;font-size:21pt;line-height:1;display:flex;align-items:center;gap:2.5mm}
.ct b svg{height:9mm;width:auto}
.num{font-size:8pt;color:#9aa0ab;font-family:"Nunito Sans"}
.row{display:flex;justify-content:space-around}
.slot{display:flex;flex-direction:column;align-items:center;gap:1.3mm;width:30mm}
.slot .ic{height:10mm;display:flex;align-items:flex-end}
.slot .ic svg{display:block}
.ring{width:17mm;height:17mm;border-radius:50%;border:0.8mm dashed;display:block}
.ring.full{border:none;box-shadow:inset 0 -1.2mm 0 rgba(0,0,0,.15),0 0.6mm 1.2mm rgba(0,0,0,.25)}
.slot span{font-family:Fredoka;font-weight:600;font-size:13pt;color:#4A5265;line-height:1}

/* Nombre */
.names{display:flex;flex-direction:column;gap:3.5mm;font-family:Fredoka;font-weight:500;font-size:16pt;line-height:1}
.names div{display:flex;align-items:flex-end;gap:2.5mm}
.names i{flex:1;border-bottom:0.45mm solid #6D6E71;height:8mm}

/* Marco para pegar */
.frame{flex:1;position:relative;border:0.8mm dashed #F7931E;border-radius:6mm;background:#FFFBF3;margin-top:3mm;overflow:hidden}
.tab{position:absolute;top:-0.8mm;left:50%;transform:translateX(-50%);background:#F7931E;color:#fff;font-family:Fredoka;font-weight:600;font-size:15pt;line-height:1;padding:2mm 5mm 2.3mm;border-radius:0 0 4mm 4mm;white-space:nowrap}
.frame svg.deco{position:absolute;left:0;bottom:0;width:100%;height:100%}
.size{position:absolute;right:3mm;top:2.5mm;font-size:6.5pt;color:#c9b89a}

.screen{max-width:297mm;margin:16px auto 0;padding:0 16px;font-size:14px;color:#4A5265}
.screen h1{font-family:Fredoka;font-size:26px;margin:0 0 6px;color:#1F2A44}
.screen table{border-collapse:collapse;margin-top:6px}
.screen td,.screen th{border:1px solid #d9d6cc;padding:3px 10px}
@media print{
  html,body{background:#fff}
  .screen{display:none}
  .sheet{margin:0;box-shadow:none;break-after:page}
  .sheet:last-child{break-after:auto}
}
</style></head><body>
<div class="screen" id="screen"></div>
<div id="pages"></div>
<script>
const N=75, SEED=20261107;
const S=0.48; // mm por unidad (igual que las piezas recortables)
const GHEX={rojo:"#E04B3A",azul:"#2453C7",amarillo:"#F2C230"};
const KEYS=["rojo","azul","amarillo"];
const TEST=new URLSearchParams(location.search).get("prueba")==="1";
const FULL=new URLSearchParams(location.search).get("relleno")==="1";

// ---- Piezas (iguales que app/core.js y artifact/piezas_recortar.html) ----
const R=(x,y,w,h,rx,c)=>({t:"r",x,y,w,h,rx,c});
const C=(cx,cy,r,c)=>({t:"c",cx,cy,r,c});
const P=(d,c)=>({t:"p",d,c});
const L=(d,c,w)=>({t:"l",d,c,w});
const coatMono=[R(80,138,14,38,5),R(100,138,14,38,5),R(134,138,14,38,5),R(152,138,14,38,5),R(72,94,96,50,12),R(36,58,54,50,12),R(16,84,32,24,8)];
const ICON={ // icono fijo gris: no delata qué pieza toca
  ears:{s:[R(70,58,16,40,7)],vb:[64,54,28,46]},
  coat:{s:coatMono,vb:[8,50,166,134]},
  tail:{s:[L("M164 104 L196 70",0,8)],vb:[156,62,48,50]}
};
function mono(part,hmm){
  const {s,vb}=ICON[part], sc=hmm/vb[3];
  const g=s.map(x=>x.t==="r"?`<rect x="${x.x}" y="${x.y}" width="${x.w}" height="${x.h}" rx="${x.rx}" fill="#cfd3db"/>`
    :`<path d="${x.d}" fill="none" stroke="#cfd3db" stroke-width="${x.w}" stroke-linecap="round"/>`).join("");
  return `<svg viewBox="${vb.join(" ")}" style="width:${(vb[2]*sc).toFixed(2)}mm;height:${hmm}mm" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
const LABEL={ears:"orejas",coat:"cuerpo",tail:"cola"};

// ---- 75 combinaciones equilibradas: exactamente 25 de cada color en cada posición ----
function combos(){
  const all=[]; for(const a of KEYS)for(const b of KEYS)for(const c of KEYS) all.push([a,b,c]);
  // 27×2 = 54 (18 por color y posición). Faltan 21 con 7 por color y posición:
  // las 27 menos 6 que tengan 2 de cada color por posición (i+j+k≡0 mod 3, sin las 3 «iguales»).
  const idx=k=>KEYS.indexOf(k);
  const extra=all.filter(([a,b,c])=>!((idx(a)+idx(b)+idx(c))%3===0 && !(a===b&&b===c)));
  const list=[...all,...all,...extra];
  // mezcla determinista (mulberry32)
  let s=SEED>>>0; const rnd=()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
  for(let j=list.length-1;j>0;j--){const r=Math.floor(rnd()*(j+1));[list[j],list[r]]=[list[r],list[j]];}
  return list;
}

const HELIX=`<svg viewBox="0 0 24 40" xmlns="http://www.w3.org/2000/svg"><path d="M5 2 C5 12 19 12 19 20 S5 28 5 38" fill="none" stroke="#29ABE2" stroke-width="3.2" stroke-linecap="round"/><path d="M19 2 C19 12 5 12 5 20 S19 28 19 38" fill="none" stroke="#F7931E" stroke-width="3.2" stroke-linecap="round"/><g stroke="#7AC143" stroke-width="2.4" stroke-linecap="round"><path d="M8 7h8M8 33h8M9.5 15.5h5M9.5 24.5h5"/></g></svg>`;

// Decoración del marco: suelo de papel verde + estrellitas
function deco(){
  const star=(x,y,r,c)=>`<path d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z" fill="${c}"/>`;
  return `<svg class="deco" viewBox="0 0 128 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="sh" x="-10%" y="-40%" width="120%" height="180%"><feDropShadow dx="0.3" dy="0.5" stdDeviation="0.3" flood-color="#5a4a30" flood-opacity="0.35"/></filter></defs>
    <path d="M0 92 Q20 88 40 91 T80 90 T128 91 V100 H0Z" fill="#B9DD94" filter="url(#sh)"/>
    <path d="M0 95 Q25 92 55 95 T128 94 V100 H0Z" fill="#7AC143" filter="url(#sh)"/>
  </svg>
  <svg class="deco" viewBox="0 0 128 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    ${star(8,16,3,"#F2C230")}${star(14,24,1.8,"#29ABE2")}${star(118,22,2.6,"#E59AAE")}${star(112,14,1.6,"#F2C230")}
  </svg>`;
}

// Comprobación de tamaño (?prueba=1): silueta del perro montado a escala real, con margen de corte
function testDog(){
  const sh=[...coatMono,R(70,58,16,40,7),P("M68 60 L106 50 L88 78 Z"),C(183,72,11)];
  const g=sh.map(x=>x.t==="r"?`<rect x="${x.x}" y="${x.y}" width="${x.w}" height="${x.h}" rx="${x.rx}"/>`:x.t==="c"?`<circle cx="${x.cx}" cy="${x.cy}" r="${x.r}"/>`:`<path d="${x.d}"/>`).join("");
  return `<svg viewBox="3 17 206 172" style="position:absolute;left:50%;bottom:5mm;transform:translateX(-50%);width:${206*S}mm;height:${172*S}mm" xmlns="http://www.w3.org/2000/svg"><g fill="#999" stroke="#999" stroke-width="10" stroke-linejoin="round" opacity=".5">${g}<path d="M164 104 L196 70" stroke-width="18" stroke-linecap="round"/></g></svg>`;
}
function half(x,n){
  if(!x) return `<div class="half empty"></div>`;
  const slot=(part,k)=>`<div class="slot"><div class="ic">${mono(part,part==="coat"?10.5:part==="ears"?10:9)}</div>
      <i class="ring${FULL?" full":""}" style="border-color:${GHEX[k]};background:${FULL?GHEX[k]:GHEX[k]+"22"}"></i><span>${LABEL[part]}</span></div>`;
  return `<div class="half">
    <div class="card">
      <div class="ct"><b>${HELIX}Mi ADN secreto</b><span class="num">nº ${n}</span></div>
      <div class="row">${slot("ears",x[0])}${slot("coat",x[1])}${slot("tail",x[2])}</div>
    </div>
    <div class="names">
      <div>Me llamo <i></i></div>
      <div>y mi perro se llama <i></i></div>
    </div>
    <div class="frame">${deco()}${TEST?testDog():""}<span class="tab">Pega aquí tu perro</span></div>
  </div>`;
}

function render(){
  const list=combos();
  let html="";
  for(let i=0;i<Math.ceil(N/2);i++){
    html+=`<section class="sheet">${half(list[2*i],2*i+1)}${half(list[2*i+1],2*i+2)}<div class="cutline"></div><span class="scis">✂</span></section>`;
  }
  document.getElementById("pages").innerHTML=html;
  // resumen en pantalla (no se imprime)
  const cnt=[0,1,2].map(p=>Object.fromEntries(KEYS.map(k=>[k,list.filter(x=>x[p]===k).length])));
  const rep={}; list.forEach(x=>{const k=x.join("-");rep[k]=(rep[k]||0)+1;});
  window.SUMMARY={counts:{orejas:cnt[0],cuerpo:cnt[1],cola:cnt[2]},distinct:Object.keys(rep).length,
    twins:Object.values(rep).filter(v=>v>1).length,list:list.map(x=>x.join("-"))};
  document.getElementById("screen").innerHTML=`<h1>Hojas «Mi ADN secreto» (${N})</h1>
    <p>Recuento por color y posición (piezas que hay que recortar):</p>
    <table><tr><th></th>${KEYS.map(k=>`<th>${k}</th>`).join("")}</tr>${["orejas","cuerpo","cola"].map((p,i)=>`<tr><td>${p}</td>${KEYS.map(k=>`<td>${cnt[i][k]}</td>`).join("")}</tr>`).join("")}</table>`;
}
render();
</script>
</body></html>
