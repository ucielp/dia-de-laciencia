<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><title>Tarjeta recuerdo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;700&display=swap">
<style>
/* Tarjeta recuerdo (solo una clase): el pin se clava en «pin aquí» y el llavero se ata por el agujero.
   Variante «matraz»: pin en el líquido del matraz, agujero del llavero arriba a la izquierda. Tarjeta blanca (sin fondo).
   24 tarjetas = 6 hojas A4 de 4 tarjetas de 95×138 mm con marcas de corte. */
@page{size:A4;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#ecebe6}
body{font-family:"Nunito Sans",sans-serif;color:#1F2A44}
.sheet{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;margin:8mm auto;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.marks{position:absolute;inset:0;width:210mm;height:297mm}
.card{position:absolute;width:95mm;height:138mm;padding:3mm}
.in{width:100%;height:100%;border-radius:6mm;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}
svg.ill{display:block}
h2{font-family:Fredoka;font-weight:700;font-size:19pt;line-height:1.02;text-align:center;margin:0;letter-spacing:-0.2pt}
h2 em{font-style:normal}
.msg{font-family:Fredoka;font-weight:500;font-size:11.5pt;line-height:1.2;color:#4A5265}
.name{display:flex;align-items:flex-end;gap:2mm;width:100%;font-family:Fredoka;font-weight:600;font-size:12pt;line-height:1}
.name i{flex:1;border-bottom:0.4mm solid #6D6E71;height:6mm}
.foot{display:flex;align-items:center;justify-content:space-between;width:100%}
.foot img{height:8.5mm;display:block;mix-blend-mode:multiply}
.foot b{font-family:Fredoka;font-weight:600;font-size:11pt;display:flex;align-items:center;gap:1.5mm}
.foot b svg{height:6mm;width:auto}
.hole{position:absolute;display:flex;align-items:center;gap:1.5mm;font-family:Fredoka;font-weight:500;font-size:7.5pt;color:#6D6E71;line-height:1}
.hole svg{width:11mm;height:11mm;display:block;flex:none}
.pc>*{filter:url(#pc)}

/* Variante A: medalla */
.A .in{background:#FFF6E6;border:0.5mm solid #F6D9A8;padding:13mm 6mm 4.5mm;gap:0}
.A h2{margin-top:1mm}
.A h2 em{color:#F7931E}
.A .mid{display:flex;align-items:center;gap:3mm;width:100%;margin:1.5mm 0 2mm}
.A .mid .msg{flex:1}
.A .name{margin-bottom:3mm}

/* Variante B: matraz */
.B .in{background:transparent;padding:6mm 6mm 4.5mm;justify-content:space-between}
.B h2{margin:0 0 0 9mm;padding-left:2mm}
.B h2 em{color:#29ABE2}
.B .msg{text-align:center;margin:0}
.B .name{margin:0}

@media print{
  html,body{background:#fff}
  .sheet{margin:0;box-shadow:none;break-after:page}
  .sheet:last-child{break-after:auto}
}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="pc" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0.5" dy="0.8" stdDeviation="0.45" flood-color="#5a4a30" flood-opacity="0.38"/></filter>
</defs></svg>
<div id="pages"></div>
<script>
const CW=95, CH=138, GX=10, GY=10;
const X0=(210-2*CW-GX)/2, Y0=(297-2*CH-GY)/2;
const LOGO="../app/img/elm.png";

// ---------- piezas de papel ----------
const star=(x,y,r,c)=>`<path d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z" fill="${c}"/>`;
const bubble=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" fill-opacity=".7" stroke="#9fd6ee" stroke-width="${Math.max(.5,r*.22)}"/>`;
function flask(x,y,s,liq,label){ // matraz Erlenmeyer, 40×50 unidades
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="pc">
    <path d="M15 3 H25 V18 L38 43 Q40.5 48 35.5 48 H4.5 Q-0.5 48 2 43 L15 18 Z" fill="#DDF1FA"/>
    <path d="M9.6 29 H30.4 L38 43 Q40.5 48 35.5 48 H4.5 Q-0.5 48 2 43 Z" fill="${liq}"/>
    <rect x="12.5" y="0" width="15" height="4.5" rx="2" fill="#BFE3F4"/></g>
    <path d="M17 7 V18" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
    ${label?`<text x="20" y="42.3" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="5.2" fill="#fff" letter-spacing=".2">${label}</text>`:""}</g>`;
}
function beaker(x,y,s,liq){ // vaso de precipitados, 28×36
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="pc">
    <path d="M1 2 H27 V32 Q27 36 23 36 H5 Q1 36 1 32 Z" fill="#DDF1FA"/>
    <path d="M1 17 H27 V32 Q27 36 23 36 H5 Q1 36 1 32 Z" fill="${liq}"/>
    <path d="M-1 0 H29 L27 4 H1 Z" fill="#BFE3F4"/></g>
    <path d="M27 9 h-5 M27 14 h-7 M27 23 h-5 M27 28 h-7" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/></g>`;
}
function potion(x,y,s,liq,cork="#B98A62"){ // frasco redondo, 30×46
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="pc">
    <rect x="10" y="7" width="10" height="12" rx="1.5" fill="#DDF1FA"/>
    <circle cx="15" cy="31" r="14" fill="#DDF1FA"/>
    <path d="M1.14 33 A14 14 0 0 0 28.86 33 Z" fill="${liq}"/>
    <rect x="9" y="1" width="12" height="7" rx="2.2" fill="${cork}"/></g>
    <path d="M7 25 Q8 21 11 19.5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>`;
}
function dna(x,y,s){ // hélice 24×60
  let rungs=""; const cols=["#E04B3A","#F2C230","#2453C7","#7AC143"];
  for(let i=0;i<6;i++){ const yy=5+i*10; const w=Math.abs(Math.cos((yy-2)/56*2*Math.PI*1.0))*12; rungs+=`<path d="M${12-w/2} ${yy} H${12+w/2}" stroke="${cols[i%4]}" stroke-width="2.4" stroke-linecap="round"/>`; }
  return `<g transform="translate(${x} ${y}) scale(${s})">${rungs}<g class="pc">
    <path d="M4 2 C4 16 20 16 20 30 S4 44 4 58" fill="none" stroke="#29ABE2" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M20 2 C20 16 4 16 4 30 S20 44 20 58" fill="none" stroke="#F7931E" stroke-width="3.6" stroke-linecap="round"/></g></g>`;
}
// perro geométrico (mismas formas que app/core.js): orejas redondas, pelaje dálmata, cola pompón
function dog(x,y,s){
  const m="#F4F1EA", b="#E3DED3", sp="#3A3A40";
  return `<g transform="translate(${x} ${y}) scale(${s}) translate(-4 -20)"><g class="pc">
    <rect x="80" y="138" width="14" height="38" rx="5" fill="${m}"/><rect x="100" y="138" width="14" height="38" rx="5" fill="${m}"/>
    <rect x="134" y="138" width="14" height="38" rx="5" fill="${m}"/><rect x="152" y="138" width="14" height="38" rx="5" fill="${m}"/>
    <rect x="72" y="94" width="96" height="50" rx="12" fill="${m}"/><rect x="86" y="130" width="66" height="9" rx="4" fill="${b}"/>
    <rect x="36" y="58" width="54" height="50" rx="12" fill="${m}"/><rect x="16" y="84" width="32" height="24" rx="8" fill="${b}"/>
    <circle cx="20" cy="88" r="6" fill="#3B2A20"/>
    <rect x="110" y="104" width="12" height="10" rx="3" fill="${sp}"/><rect x="140" y="116" width="10" height="9" rx="3" fill="${sp}"/><rect x="60" y="64" width="9" height="8" rx="3" fill="${sp}"/>
    <path d="M72 54 H96 L98 60 A16 16 0 1 1 72 76 Z" fill="#4A4E5C" stroke="#4A4E5C" stroke-width="2" stroke-linejoin="round"/>
    <path d="M164 104 L180 80" stroke="#D9C3A0" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="183" cy="72" r="11" fill="#D9C3A0"/></g>
    <path d="M26 100 L40 100" stroke="#5A3E2B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="76" r="8.5" fill="#FFFDF6"/><circle cx="58.5" cy="77" r="4.6" fill="#2A2A30"/></g>`;
}
const HELIX=`<svg viewBox="0 0 24 40" xmlns="http://www.w3.org/2000/svg"><path d="M5 2 C5 12 19 12 19 20 S5 28 5 38" fill="none" stroke="#29ABE2" stroke-width="3.4" stroke-linecap="round"/><path d="M19 2 C19 12 5 12 5 20 S19 28 19 38" fill="none" stroke="#F7931E" stroke-width="3.4" stroke-linecap="round"/><g stroke="#7AC143" stroke-width="2.4" stroke-linecap="round"><path d="M8 7h8M8 33h8M9.5 15.5h5M9.5 24.5h5"/></g></svg>`;
// agujero del llavero: refuerzo de papel + círculo a perforar
const HOLE=`<svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg"><g class="pc"><circle cx="11" cy="11" r="9.5" fill="#F7931E"/></g><circle cx="11" cy="11" r="5" fill="#fff" stroke="#1F2A44" stroke-width=".7" stroke-dasharray="1.6 1.2"/><path d="M9 11h4M11 9v4" stroke="#1F2A44" stroke-width=".6"/></svg>`;
// diana para el pin (diámetro en unidades = mm)
const pinTarget=(cx,cy,r,ring)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${ring}" stroke-width=".7" stroke-dasharray="2 1.4"/>
  <path d="M${cx-2.2} ${cy}h4.4M${cx} ${cy-2.2}v4.4" stroke="#1F2A44" stroke-width=".45"/>`;

function medal(){ // 38×46 mm
  const cx=19, cy=18, n=18; let pts="";
  for(let i=0;i<2*n;i++){ const a=i*Math.PI/n, r=i%2?16.2:18; pts+=`${(cx+r*Math.sin(a)).toFixed(2)},${(cy-r*Math.cos(a)).toFixed(2)} `; }
  return `<svg class="ill" viewBox="0 0 38 46" style="width:38mm;height:46mm;flex:none" xmlns="http://www.w3.org/2000/svg">
    <g class="pc"><path d="M12 28 L5 44 L10 41.5 L12.5 46 L18 32 Z" fill="#29ABE2"/><path d="M26 28 L33 44 L28 41.5 L25.5 46 L20 32 Z" fill="#F7931E"/>
    <polygon points="${pts}" fill="#7AC143"/><circle cx="${cx}" cy="${cy}" r="15" fill="#F2C230"/></g>
    ${pinTarget(cx,cy,13,"#F7931E")}</svg>`;
}
function illA(){ // 83×40 mm
  return `<svg class="ill" viewBox="0 0 83 40" style="width:83mm;height:40mm" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 37.5 Q20 35 42 37 T83 36.5 V40 H0Z" fill="#F6D9A8"/>
    ${flask(1,6.5,0.62,"#7AC143","SCIENCE")}
    ${beaker(21,21.5,0.42,"#F7931E")}
    ${dog(31,6.5,0.158)}
    ${potion(62,13,0.52,"#E59AAE")}
    ${dna(73,1,0.4)}
    ${bubble(10,4,1.6)}${bubble(13.5,1.6,1)}${bubble(67,8.5,1.3)}${bubble(70,5,0.8)}
    ${star(25,8,2.2,"#F2C230")}${star(57,4,1.8,"#29ABE2")}${star(60,9,1.1,"#E04B3A")}
  </svg>`;
}
function illB(){ // 83×64 mm: gran matraz con la diana del pin en el líquido
  return `<svg class="ill" viewBox="0 0 83 64" style="width:83mm;height:64mm" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 61 Q20 58.5 42 60.5 T83 60 V64 H0Z" fill="#BFE3F4"/>
    ${dna(1,5,0.58)}
    <g transform="translate(3 0)"><g class="pc">
      <path d="M33.5 6 H49.5 V22 L68 54 Q71 61 64 61 H19 Q12 61 15 54 L33.5 22 Z" fill="#fff"/>
      <path d="M26 35 H57 L68 54 Q71 61 64 61 H19 Q12 61 15 54 Z" fill="#9B7BD4"/>
      <rect x="31" y="2.5" width="21" height="5.5" rx="2.4" fill="#BFE3F4"/></g>
    <path d="M36 10 V22" stroke="#DDF1FA" stroke-width="2" stroke-linecap="round"/>
    ${pinTarget(41.5,46,12.5,"#1F2A44")}</g>
    ${bubble(49,30,1.8)}${bubble(42,26,1.2)}${bubble(25,3,1.2)}
    ${potion(70.5,33,0.42,"#7AC143","#F7931E")}
    ${beaker(72,11,0.36,"#E04B3A")}
    ${dog(0,44.6,0.1)}
    ${star(22,8,2.3,"#F2C230")}${star(62,6,1.8,"#E59AAE")}${star(27,16,1.2,"#29ABE2")}
  </svg>`;
}
const foot=()=>`<div class="foot"><img src="${LOGO}" alt="Institut-Escola Lluís Millet"><b>${HELIX}Dia de la Ciència</b></div>`;
const MSG="Fes preguntes, observa i no deixis mai d'investigar.";
function cardA(){
  return `<div class="in">
    <div class="hole" style="left:50%;top:2mm;transform:translateX(-50%)">${HOLE}</div>
    
    ${illA()}
    <h2>Tots podem<br>ser <em>científics</em>!</h2>
    <div class="mid">${medal()}<p class="msg">${MSG}</p></div>
    <div class="name">Nombre: <i></i></div>
    ${foot()}</div>`;
}
function cardB(){
  return `<div class="in">
    <div class="hole" style="left:3mm;top:3mm;flex-direction:column;gap:0.6mm">${HOLE}</div>
    <h2>Tots podem<br>ser <em>científics</em>!</h2>
    ${illB()}
    <p class="msg">Fes preguntes, observa<br>i no deixis mai d'investigar.</p>
    ${foot()}</div>`;
}
function marks(){
  let g=""; const L=3.6, off=1.2;
  for(const i of [0,1]) for(const j of [0,1]){
    const x0=X0+i*(CW+GX), y0=Y0+j*(CH+GY), xs=[x0,x0+CW], ys=[y0,y0+CH];
    for(const [xi,x] of xs.entries()) for(const [yi,y] of ys.entries()){
      const sx=xi?1:-1, sy=yi?1:-1;
      g+=`<path d="M${x+sx*off} ${y}h${sx*L}M${x} ${y+sy*off}v${sy*L}"/>`;
    }
  }
  return `<svg class="marks" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg"><g stroke="#555" stroke-width=".2" fill="none">${g}</g></svg>`;
}
function sheet(fn,cls){
  let h="";
  for(const i of [0,1]) for(const j of [0,1])
    h+=`<div class="card ${cls}" style="left:${X0+i*(CW+GX)}mm;top:${Y0+j*(CH+GY)}mm">${fn()}</div>`;
  return `<section class="sheet">${marks()}${h}</section>`;
}
const SHEETS=6; // 6 hojas × 4 = 24 tarjetas
document.getElementById("pages").innerHTML=Array.from({length:SHEETS},()=>sheet(cardB,"B")).join("");
</script>
</body></html>
