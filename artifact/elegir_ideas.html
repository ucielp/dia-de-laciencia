<title>Elegir ideas del Día de la Ciencia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: tablero de cartas agrupadas por familia; barra fija con el recuento; cada carta lleva tres gomets (sí / quizás / no). */
:root{
  --bg:#f6f4ee; --card:#fffdf8; --ink:#1d2433; --muted:#5d6577; --line:#e3ded2;
  --accent:#2453c7; --si:#16a34a; --no:#dc2626; --qz:#e0a800; --chip:#efeadf;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171f; --card:#1c2130; --ink:#e9ecf3; --muted:#9aa3b5; --line:#2c3344;
  --accent:#7fa2ff; --si:#3ccf74; --no:#ff6b6b; --qz:#f5c542; --chip:#262c3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171f; --card:#1c2130; --ink:#e9ecf3; --muted:#9aa3b5; --line:#2c3344;
  --accent:#7fa2ff; --si:#3ccf74; --no:#ff6b6b; --qz:#f5c542; --chip:#262c3c; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);max-width:65ch;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;margin-top:18px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.count{display:flex;gap:10px;font-variant-numeric:tabular-nums;font-weight:700}
.count span{display:inline-flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-size:12px;color:var(--muted);width:100%}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:30px 0 10px;text-wrap:balance}
h2 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:opacity .2s}
.card[data-d="si"]{border-color:var(--si);box-shadow:inset 0 0 0 1px var(--si)}
.card[data-d="no"]{opacity:.5}
.card[data-d="quizas"]{border-color:var(--qz)}
.top{display:flex;gap:8px;align-items:baseline}
.code{font-size:12px;font-weight:700;color:var(--accent);background:var(--chip);border-radius:6px;padding:1px 6px;white-space:nowrap}
.name{font-weight:700;font-size:16px;line-height:1.3}
.star{color:var(--qz)}
.what{margin:0;font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
details{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent)}
details p{margin:6px 0 0}
.vote{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.vote button{flex:1;font:inherit;font-weight:700;font-size:14px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);padding:6px 0;cursor:pointer;display:inline-flex;justify-content:center;align-items:center;gap:6px}
.vote button .dot{width:10px;height:10px}
.vote button[aria-pressed="true"][data-v="si"]{background:var(--si);border-color:var(--si);color:#fff}
.vote button[aria-pressed="true"][data-v="no"]{background:var(--no);border-color:var(--no);color:#fff}
.vote button[aria-pressed="true"][data-v="quizas"]{background:var(--qz);border-color:var(--qz);color:#1d2433}
.note{font:inherit;font-size:13px;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:5px 8px}
button:focus-visible,.note:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<div class="wrap">
  <h1>¿Qué hacemos el Día de la Ciencia?</h1>
  <p class="lede">Todas las ideas de los informes v2, v3 y v4 (1º y 2º de primaria, El Masnou). Marca cada una con sí, quizás o no, y añade una nota si quieres. Con las que queden en «sí» armo las diapositivas.</p>
  <div class="bar">
    <div class="count" aria-live="polite">
      <span><i class="dot" style="background:var(--si)"></i><b id="nSi">0</b> sí</span>
      <span><i class="dot" style="background:var(--qz)"></i><b id="nQz">0</b> quizás</span>
      <span><i class="dot" style="background:var(--no)"></i><b id="nNo">0</b> no</span>
      <span style="color:var(--muted);font-weight:400"><b id="nPend">0</b> sin mirar</span>
    </div>
    <div class="filters" role="group" aria-label="Filtrar">
      <button id="f-all" data-f="all" aria-pressed="true">Todas</button>
      <button id="f-pend" data-f="pend" aria-pressed="false">Sin mirar</button>
      <button id="f-si" data-f="si" aria-pressed="false">Sí</button>
      <button id="f-quizas" data-f="quizas" aria-pressed="false">Quizás</button>
      <button id="f-top" data-f="top" aria-pressed="false">★ Favoritas</button>
    </div>
    <div class="status" id="status">Conectando…</div>
  </div>
  <div id="list"></div>
</div>

<script>
const IDEAS = [{"id": "v2-A1", "rep": "v2", "code": "A1", "group": "Ideas WOW (v2)", "name": "Paciente Cero: el germen invisible que brilla", "top": true, "what": "Sin que nadie lo sepa, al empezar le pones polvo/gel fluorescente invisible en la mano a 1–2 niños (o a ti). Durante la sesión se tocan, se dan la mano, abren la puerta. Al final: luces apagadas, linterna UV, y media clase brilla en la oscuridad. Entonces viene el misterio: entre todos reconstruyen en la pizarra «¿quién tocó a quién?» y encuentran al Paciente Cero.", "why": "Oscuridad + cosas que brillan + misterio + ellos son los detectives. Les pilla por sorpresa: no sabían que estaban dentro del experimento.", "sci": "Es epidemiología y ciencia de redes: «con ordenadores y el ARN del virus encontramos al Paciente Cero entre millones de personas, así se siguió la COVID».", "src": "Mark Rober (vídeo viral en un aula de 3º con Glo Germ); yourgenome/Wellcome «Handshake Hazard»", "time": "Sembrar al inicio + 15 al final", "mat": "40–60 €", "note": "No tóxico. Solo en manos, no en cara. Lavado al final. Avisar a las profes (no a los niños)."}, {"id": "v2-A2", "rep": "v2", "code": "A2", "group": "Ideas WOW (v2)", "name": "Entrena a la máquina en directo… y engáñala", "top": true, "what": "En el proyector, en 2 minutos, entrenas al ordenador con voluntarios: «brazos arriba = dinosaurio, brazos abajo = pájaro» (o un peluche vs un coche). Luego toda la clase hace la pose y la pantalla adivina. Después intentan engañarla con medias poses o con un peluche. Gran giro final: la entrenaste solo con un niño o solo con objetos rojos, y falla con los demás.", "why": "Ellos son los datos con su propio cuerpo. Y ganan cuando la engañan. Entienden «la máquina solo sabe lo que le enseñamos» sin una palabra técnica.", "sci": "Es literalmente tu trabajo: «Yo le enseño al ordenador miles de formas de ARN, igual que vosotros le habéis enseñado dinosaurios».", "src": "Google Teachable Machine; guía «Learning like a robot» (4–7 años); Blakeley Payne (MIT Media Lab) con niños de 6–10", "time": "15", "mat": "0 €", "note": "Funciona en el navegador sin enviar imágenes. Usar poses u objetos, no caras. No guardar el proyecto. Probar en casa con el wifi del colegio (o sin wifi) antes."}, {"id": "v2-A3", "rep": "v2", "code": "A3", "group": "Ideas WOW (v2)", "name": "Pulmones de verdad que se inflan", "top": true, "what": "Sacas de una bandeja unos pulmones de cerdo (en la carnicería: «bofe»/«asadura», pídelos con tráquea). Metes un tubo y bombeas: el órgano flácido se hincha enorme y rosa y luego «suspira». Toda la clase respira al mismo ritmo que el pulmón.", "why": "Real, enorme, un poco asqueroso y parece vivo. Es el tipo de momento que cuentan en casa esa misma noche.", "sci": "«Cada trocito rosa son millones de células, y cada una tiene su libro de instrucciones».", "src": "Outreach universitario: U. Edinburgh (6º primaria), UAB (3º), una médica-madre en Dunedin con pulmones de ciervo y un inflador de bici", "time": "8–10", "mat": "5–10 € (carnicería) o kit 150–300 €", "note": "Guantes, bandeja, bolsa. Avisar a las familias con una nota (familias vegetarianas o niños aprensivos: pueden mirar desde lejos)."}, {"id": "v2-A4", "rep": "v2", "code": "A4", "group": "Ideas WOW (v2)", "name": "Papá robot: el reto de las instrucciones exactas", "top": true, "what": "Eres un robot que hace EXACTAMENTE lo que le dicen. Los niños te dictan cómo hacer un bocadillo de mermelada: si dicen «pon la mermelada en el pan», pones el bote cerrado encima del pan. Con cada error lo arreglan («depurar»). Versión biología: «yo soy una célula y vosotros sois mi ADN; cada error es una mutación» y sale un bocadillo monstruo.", "why": "Un adulto que obedece a niños y hace el tonto. Es la actividad que más risas genera a esta edad.", "sci": "El ADN es un programa que lee una máquina (el ribosoma). Una letra mal y sale otra cosa.", "src": "Josh Darnit «Exact Instructions Challenge» (vídeo viral); Linda Liukas «Hello Ruby»; CATEDU (Aragón) para infantil y 1er ciclo", "time": "10–15", "mat": "5 €", "note": "Alergias: usar pan sin frutos secos. Cuchillo de plástico."}, {"id": "v2-A5", "rep": "v2", "code": "A5", "group": "Ideas WOW (v2)", "name": "¿Chihuahua o magdalena? Niños contra la IA", "top": false, "what": "Proyectas la famosa cuadrícula de fotos. La clase grita «¡perro!» o «¡magdalena!» en cada una. Luego enseñas en cuáles se equivocó el ordenador. Hay más parejas: perro pastor/fregona, labradoodle/pollo frito.", "why": "Fotos graciosas y ellos ganan al ordenador. Perfecto para abrir y bajar nervios.", "sci": "La IA no «ve» como nosotros: busca patrones, y a veces patrones equivocados.", "src": "Mariya Yao (freeCodeCamp) probó APIs de visión con la cuadrícula chihuahua/magdalena: «un niño pequeño gana al deep learning»", "time": "5", "mat": "0 €", "note": "Ninguno."}, {"id": "v2-A6", "rep": "v2", "code": "A6", "group": "Ideas WOW (v2)", "name": "Carrera contra la IA que adivina dibujos (Quick, Draw!)", "top": false, "what": "Un voluntario dibuja en el portátil o en la pizarra digital mientras la IA dice en voz alta lo que cree que es. La clase intenta adivinar antes que la máquina. Al final enseñas cientos de gatos dibujados por niños de todo el mundo.", "why": "La máquina habla y es una carrera. Todos quieren salir a dibujar.", "sci": "«La IA aprende de millones de dibujos; yo busco patrones en millones de trozos de ARN».", "src": "Google Quick, Draw! (50 millones de dibujos, 345 categorías)", "time": "10", "mat": "0 €", "note": "Necesita internet. Sin cámara. Tener un vídeo grabado por si falla el wifi."}, {"id": "v2-A7", "rep": "v2", "code": "A7", "group": "Ideas WOW (v2)", "name": "Bebés monstruo: genética a cara o cruz", "top": false, "what": "Por parejas: uno es «mamá monstruo» y otro «papá monstruo», cada uno con su carta de rasgos (cuernos sí/no, 1 o 3 ojos, manchas, color). Para cada rasgo tiran una moneda y construyen el bebé con plastilina y limpiapipas. Los hermanos salen distintos. Carta sorpresa «mutación»: un error en la receta da un rasgo nuevo que no tenía nadie.", "why": "Monstruos, crear con las manos, azar, y responde a algo que se preguntan de verdad: «¿por qué me parezco a mamá?».", "sci": "El gen es una receta. El ARN es la fotocopia con la que cocina la célula. La mutación es una errata.", "src": "ASU «Ask A Biologist: Monster Inheritance»; Maine DOE «A Pack of Monsters» (1º primaria); U. Edinburgh «Build a monster»", "time": "30", "mat": "20 €", "note": "Plastilina sin gluten si hay celíacos."}, {"id": "v2-A8", "rep": "v2", "code": "A8", "group": "Ideas WOW (v2)", "name": "Inmunidad: pilla-pilla de superhéroes (con vacuna)", "top": false, "what": "En el patio: unos niños son virus que intentan cruzar «el cuerpo». Otros son la piel (se dan la mano y hacen muro). Otros son glóbulos blancos que pillan virus. Ronda «vacuna»: antes de empezar, los glóbulos blancos ven el cartel de «SE BUSCA» con la cara del virus, y lo pillan mucho más rápido.", "why": "Correr, superhéroes, y es de los pocos juegos que funcionan con 50 niños a la vez. Explica las vacunas sin agujas.", "sci": "Dengue y zika: virus de ARN que estudias. «Una vacuna es enseñarle al cuerpo el cartel de SE BUSCA».", "src": "Science in School «Ready, set, infect!»; HowToSmile (cinturones rojos para gérmenes, pulseras blancas para glóbulos blancos)", "time": "15–20", "mat": "0–15 €", "note": "Nivel educación física. Andar rápido en vez de correr si el espacio es pequeño."}, {"id": "v2-A9", "rep": "v2", "code": "A9", "group": "Ideas WOW (v2)", "name": "Estornudo medido: ¿hasta dónde llega?", "top": false, "what": "Una tira de papel de 4 m en el suelo con muñequitos dibujados. Cada uno apuesta dónde caerá el «estornudo» y se pone ahí. Disparas un pulverizador con agua coloreada: medís, contáis cuántos muñecos se «contagiaron». Repetís con un pañuelo y con el codo.", "why": "Estornudar sobre cosas, apostar, y descubrir que se equivocaron. Además salen datos para hacer un gráfico.", "sci": "Virus respiratorios (de ARN) y un gráfico de clase en directo.", "src": "yourgenome «Sneeze Zone» (lo usó un Year 1 en un STEAM day); Science Friday; MIT midió gotas a 6–8 m", "time": "10", "mat": "<10 €", "note": "Agua con colorante mancha: hacerlo en el patio o con plástico."}, {"id": "v2-A10", "rep": "v2", "code": "A10", "group": "Ideas WOW (v2)", "name": "Placa de tus manos: lo que vive en ti (resultado en una semana)", "top": true, "what": "Enseñas la foto de la mano de colores. Cada grupo apoya los dedos en una placa antes de lavarse y en otra después. Algún voluntario toca el móvil, una zapatilla o una moneda. Las placas se van contigo y a la semana vuelves (o mandas fotos) con colonias de colores: «esto vive en VOSOTROS».", "why": "Lo descubren días después: es la actividad que se recuerda semanas. Es personal, asquerosa y bonita a la vez.", "sci": "Microbioma: «en mi laboratorio leemos el ADN de estos bichitos para saber quiénes son».", "src": "Tasha Sturm: foto viral de la mano de su hijo de 8 años en agar (≈2 M de vistas); Science in School «Painting in a petri dish» (U. Lisboa)", "time": "15 + 10 a la semana", "mat": "≈1 € por placa", "note": "Las placas las preparas, incubas (≤25 °C, nunca a 37 °C) y destruyes tú en tu instituto. Cerradas con cinta y NUNCA se reabren. Pedir permiso a dirección. Si dicen que no: usa la foto viral y listo."}, {"id": "v2-A11", "rep": "v2", "code": "A11", "group": "Ideas WOW (v2)", "name": "La biblioteca gigante y la caza de la errata", "top": false, "what": "Sacas 2 metros de hilo fino de una cajita del tamaño de un guisante: «esto está en cada puntito de vosotros». Enseñas la foto de la estantería del genoma impreso, más alta que una jirafa, escrita solo con A, C, G y T. Cada niño recibe una tira de letras de colores y busca la errata escondida (la mutación) o su «palabra secreta».", "why": "Escala gigante + truco de magia + búsqueda del tesoro.", "sci": "Literalmente tu trabajo: leer el libro y encontrar las erratas, pero con un ordenador que lo hace en un segundo.", "src": "Wellcome Collection (genoma humano impreso: más de 100 volúmenes, una estantería enorme); packs de DNA origami Oxford/Royal Society", "time": "10", "mat": "Impresión + hilo", "note": "Ninguno. Las cifras de volúmenes varían según la fuente: di «más de 100 libros»."}, {"id": "v2-A12", "rep": "v2", "code": "A12", "group": "Ideas WOW (v2)", "name": "Gráfico humano + el ordenador lo dibuja en directo", "top": false, "what": "«¿Cuántos dientes se os han caído?» o «¿animal favorito?». Los niños se ponen en filas en el suelo marcado con cinta: son un gráfico de barras humano. Tú tecleas los números y aparece el gráfico en la pantalla. Pregunta de detective: «¿qué grupo es el más grande? ¿hay alguna sorpresa?».", "why": "Se mueven, se ven a sí mismos convertidos en datos y luego en un dibujo en la pantalla.", "sci": "«Yo hago gráficos con millones de datos, pero la idea es esta».", "src": "Práctica docente común (sin fuente única)", "time": "10", "mat": "0 €", "note": "Solo números de grupo, nada personal."}, {"id": "v2-A13", "rep": "v2", "code": "A13", "group": "Ideas WOW (v2)", "name": "Tu brazo lo controla mi cerebro (Backyard Brains)", "top": true, "what": "Un niño aprieta el puño y TU brazo se mueve solo. Luego van turnándose para «controlarte». Es la demo más espectacular de toda la lista, pero cuesta dinero.", "why": "Sienten que tienen un superpoder y que controlan a un adulto.", "sci": "El cuerpo funciona con señales eléctricas, que son datos que un ordenador puede leer.", "src": "Greg Gage / Backyard Brains, «Human-Human Interface» (charla TED con millones de vistas)", "time": "10", "mat": "≈300 € (kit)", "note": "Solo tú recibes la estimulación; el niño solo lleva electrodos pasivos. Revisar instrucciones del fabricante. Opcional: quizá tu universidad tenga uno."}, {"id": "v2-A14", "rep": "v2", "code": "A14", "group": "Ideas WOW (v2)", "name": "Construye un virus con su receta de ARN dentro", "top": false, "what": "Cada niño hace un virus con una bola, plastilina y limpiapipas (las «llaves» para entrar en la célula). Antes de cerrarlo, mete dentro una tira de papel con su «receta de ARN» de colores. Al final, foto de microscopio electrónico del virus del zika: «¡se parece al vuestro!».", "why": "Crear algo con las manos que se pueden llevar, y la idea de un «paquete secreto» dentro.", "sci": "La más directa con tu proyecto de dengue/zika: «un virus es una bolsa con una receta de ARN; yo leo esa receta».", "src": "Glasgow Caledonian Univ. (Glasgow Science Festival 2025); Alaska Afterschool «Construye un virus» (en castellano, 5–9 años)", "time": "20–25", "mat": "20 €", "note": "Ninguno."}, {"id": "v2-A15", "rep": "v2", "code": "A15", "group": "Ideas WOW (v2)", "name": "Sangre en un bote para llevar a casa", "top": false, "what": "Cada niño llena un bote: agua amarilla con sal (plasma), cereales rojos (glóbulos rojos), pompones blancos (glóbulos blancos), confeti (plaquetas). Lo agitan y se lo llevan.", "why": "Un souvenir de «sangre de verdad». Les encanta llevárselo.", "sci": "«En un análisis de sangre se puede leer el ARN y el ADN para saber si estás enfermo».", "src": "U. Liverpool «Make your own blood» (6–11 años, «la actividad más popular» de su evento); U. Salford «Build your blood»", "time": "15–20", "mat": "≈1 €/niño", "note": "No comer. Evitar nubes con gelatina de cerdo (usar pompones); cereales con gluten. Botes con rosca."}, {"id": "v2-A16", "rep": "v2", "code": "A16", "group": "Ideas WOW (v2)", "name": "Ojo de cerdo: la lente que es un cristal", "top": false, "what": "Abres un ojo de cerdo bajo la cámara del portátil proyectada. Sale una gelatina negra y luego una lente transparente como un cristal, que aumenta las letras de un papel.", "why": "Asqueroso y precioso a la vez: «la joya escondida dentro del ojo».", "sci": "La retina está hecha de células que captan la luz, y la IA lee fotos del ojo para detectar enfermedades.", "src": "Exploratorium (San Francisco) «Cow eye dissection»; Science Museum of Virginia", "time": "10", "mat": "Pocos € (carnicería)", "note": "Solo corta el adulto. Avisar a las familias. Proyectar para que 50 niños lo vean. Puede ser demasiado para algunos: opcional."}, {"id": "v3-A1", "rep": "v3", "code": "A1", "group": "A · Tú eres el experimento", "name": "Tu cerebro no ve al dinosaurio (gorila invisible en vivo)", "top": true, "what": "Los niños cuentan en voz alta los pases de pelota entre tres compañeros. Mientras tanto la profe cruza el aula con una máscara de dinosaurio o un plátano gigante. Casi nadie lo ve. Luego se pregunta quién vio al dinosaurio y se repite para que lo vean todos.", "why": "Les explota la cabeza haberse perdido algo tan obvio. Y quieren hacérselo a sus padres esa noche.", "sci": "«Solo encuentras lo que buscas. Por eso los científicos miramos los datos con ojos nuevos, y por eso usamos ordenadores que miran todo.»", "src": "Daniel Simons y Christopher Chabris, «Selective attention test» — youtube.com/watch?v=vJG698U2Mvo", "time": "5 min", "mat": "Una pelota y una máscara o disfraz", "note": "Funciona mejor como primera actividad, antes de que sospechen."}, {"id": "v3-A2", "rep": "v3", "code": "A2", "group": "A · Tú eres el experimento", "name": "¿Qué ha cambiado? (ceguera al cambio)", "top": true, "what": "Se proyecta el vídeo del truco de cartas que les engaña, y al final todo el fondo ha cambiado de color. Giro propio: durante la sesión tú has cambiado en secreto tres cosas de ti o del aula (jersey, gafas, un póster). Al final se lo dices y se ponen a buscar.", "why": "Es una caza del tesoro sobre algo que estuvo delante de ellos todo el rato.", "sci": "«Encontrar la diferencia entre dos cosas casi iguales es mi trabajo: buscar la letra cambiada entre millones.»", "src": "Richard Wiseman, Quirkology, «Colour Changing Card Trick» — youtube.com/watch?v=v3iPrBrGSJM", "time": "5 min", "mat": "Ropa de recambio, un objeto del aula", "note": "Combina muy bien con A1: ambas dicen «tu cerebro te engaña»."}, {"id": "v3-A3", "rep": "v3", "code": "A3", "group": "A · Tú eres el experimento", "name": "La moneda mágica: ¿quién tiene suerte?", "top": true, "what": "Los 45 niños lanzan una moneda a la vez. Los que sacan cruz se sientan. Siempre queda alguien de pie tras cinco o seis rondas y se le corona «niño de la suerte». Luego la revelación: con tantos niños, alguien tenía que ganar seguro. No era magia, eran matemáticas.", "why": "Todos participan, hay tensión ronda a ronda, y la revelación cambia lo que pensaban de la suerte.", "sci": "«Cuando miro millones de trozos de ADN, siempre aparece algo raro por casualidad. Tengo que saber cuándo es suerte y cuándo es de verdad.»", "src": "Derren Brown, «10 heads in a row» — youtube.com/watch?v=XzYLHOX50Bc · explicación de James Grime — youtube.com/watch?v=rwvIGNXY21Y", "time": "8 min", "mat": "Una moneda por niño (o fichas de dos colores)", "note": "Distinto del bebé monstruo: aquí la idea es el azar en un grupo grande, no la herencia."}, {"id": "v3-A4", "rep": "v3", "code": "A4", "group": "A · Tú eres el experimento", "name": "El juego de Penney: papá siempre gana", "top": false, "what": "Un niño elige una secuencia de tres colores (rojo-azul-rojo). Tú eliges la tuya después. Se lanza una moneda gigante hasta que sale una de las dos secuencias, y tú ganas casi siempre aunque la moneda es justa. La clase intenta pillarte haciendo trampa.", "why": "Un adulto que gana «injustamente» y ellos tienen que descubrir el truco.", "sci": "Es búsqueda de motivos en secuencias, exactamente lo que se hace con ADN y ARN: unos patrones aparecen antes que otros.", "src": "Numberphile, «Penney's Game» — youtube.com/watch?v=Sa9jLWKrX0c", "time": "10 min", "mat": "Una moneda grande, tarjetas de colores", "note": "Para 1º puede ser difícil seguir las secuencias: usar solo colores, nunca letras."}, {"id": "v3-A5", "rep": "v3", "code": "A5", "group": "A · Tú eres el experimento", "name": "El bote de la honestidad", "top": false, "what": "Un bote de pegatinas con un cartel «coge UNA» y tú «sales un momento». Sabes en secreto cuántas había. Después enseñas el resultado de toda la clase. Se repite con unos ojos saltones pegados al bote: la gente se porta mejor cuando se siente observada.", "why": "Descubren que eran el experimento. Y el truco de los ojos les parece increíble.", "sci": "Hipótesis, grupo control y grupo de prueba: así se prueban los medicamentos.", "src": "Mark Rober, «Candy Thieves vs Rigged Candy Bowl» — youtube.com/watch?v=Zb01RStdzEs", "time": "10 min", "mat": "Pegatinas, ojos saltones", "note": "Mostrar solo el total de la clase, nunca quién cogió qué."}, {"id": "v3-A6", "rep": "v3", "code": "A6", "group": "A · Tú eres el experimento", "name": "Rojo escrito en azul: 1º contra 2º", "top": false, "what": "Tienen que decir el color de la tinta de palabras como ROJO escrita en azul. Lo bonito es comparar cursos: los de 2º, que leen mejor, pueden ir más lentos porque no pueden evitar leer. Tú haces el gráfico de los dos grupos en directo.", "why": "Competición entre cursos y un resultado que no se esperan.", "sci": "Un experimento real con dos grupos y un gráfico, como un estudio científico.", "src": "Operation Ouch! (BBC), «The Stroop Test» — youtube.com/watch?v=wvS7k15BRGk", "time": "8 min", "mat": "Tarjetas impresas (en catalán o castellano)", "note": "Los de 1º que aún no leen bien «ganan»: está bien, es parte de la sorpresa."}, {"id": "v3-A7", "rep": "v3", "code": "A7", "group": "A · Tú eres el experimento", "name": "Cerebro al revés: dibujar en el espejo", "top": false, "what": "Primero se ven 30 segundos del vídeo de la bicicleta que gira al revés. Luego intentan repasar una estrella mirando su mano solo en un espejo. Es dificilísimo y da risa, pero mejora en cada intento. Los errores de cada intento van a una curva de aprendizaje.", "why": "Es un reto físico divertido y ven cómo su cerebro aprende en minutos.", "sci": "La curva de aprendizaje es la misma que la de una inteligencia artificial cuando se entrena.", "src": "Smarter Every Day, «The Backwards Brain Bicycle» — youtube.com/watch?v=MFzDaBzBlL0", "time": "10 min", "mat": "Espejitos (bazar), cartulina", "note": "Con 45 niños, por parejas y unos pocos espejos rotando."}, {"id": "v3-A8", "rep": "v3", "code": "A8", "group": "A · Tú eres el experimento", "name": "El club de la regla secreta", "top": false, "what": "Tienes un club con una regla secreta. Los niños te ofrecen objetos y tú solo dices «entra» o «no entra». Todos se inventan reglas complicadas y la de verdad es tonta, por ejemplo «todo lo que no es verde». La lección: prueba también lo que crees que va a fallar.", "why": "Adivinar un secreto del adulto. Muy parecido a cómo piensan a esa edad.", "sci": "Probar hipótesis. Y es lo que hace un clasificador de inteligencia artificial: aprender una regla a partir de ejemplos sí y no.", "src": "Veritasium, «The Most Common Cognitive Bias» (juego 2-4-6) — youtube.com/watch?v=vKA4w2O61Xo", "time": "8 min", "mat": "Objetos del aula", "note": ""}, {"id": "v3-A9", "rep": "v3", "code": "A9", "group": "A · Tú eres el experimento", "name": "El apretón que viaja (cadena de neuronas)", "top": false, "what": "Se enseña un minuto del vídeo de Gage, donde un cerebro mueve el brazo de otra persona. Luego toda la clase se da la mano en cadena, se pasa un apretón y tú cronometras. Repiten tres veces, y el gráfico en el proyector muestra que cada vez van más rápido.", "why": "Toda la clase es el experimento y quieren batir su propio récord.", "sci": "Señales eléctricas, medir, y un primer gráfico de datos hecho por ellos.", "src": "Inspirado en Greg Gage, TED «How to control someone else's arm with your brain» — ted.com/talks/greg_gage_how_to_control_someone_else_s_arm_with_your_brain", "time": "8 min", "mat": "Cronómetro (móvil) y una hoja de cálculo", "note": "Para quien no quiera darse la mano: pasar un pañuelo o tocar el hombro."}, {"id": "v3-A10", "rep": "v3", "code": "A10", "group": "A · Tú eres el experimento", "name": "Ilusiones relámpago: agujero en la mano, Yanny o Laurel", "top": false, "what": "Miran por un tubo de papel y ven un agujero en su propia mano. En el audio de Yanny o Laurel, media clase oye una palabra y la otra media otra distinta, y se miran asombrados.", "why": "Reacciones enormes en dos o tres minutos. Ideal para empezar o para recuperar la atención.", "sci": "«Todos tenemos el mismo mundo, pero sensores distintos.»", "src": "Operation Ouch! «Hole in your hand» — youtube.com/watch?v=2C5jdVcAM5U · Yanny/Laurel (2018)", "time": "3–5 min", "mat": "Folios, altavoces", "note": "Yanny/Laurel depende mucho del altavoz: probarlo antes en el aula. Enseñar antes las dos palabras."}, {"id": "v3-B1", "rep": "v3", "code": "B1", "group": "B · Máquinas que aprenden (más allá del Teachable Machine básico)", "name": "Sus dibujos cobran vida y bailan (Animated Drawings)", "top": true, "what": "Los niños dibujan un monstruo o un personaje. Fotografías unos cuantos dibujos y la inteligencia artificial les encuentra el esqueleto: en el proyector, su dibujo salta, baila y saluda.", "why": "Probablemente es el mayor «wow» de todo el banco. Es su dibujo, y está vivo.", "sci": "«La IA encontró los brazos y las piernas escondidos en un dibujo. Yo enseño a la IA a encontrar la forma escondida dentro de un ARN.»", "src": "Meta FAIR, sketch.metademolab.com", "time": "10 min", "mat": "Portátil, móvil para la foto, internet", "note": "Meta dejó de mantener la web en 2023 y la publicó como código abierto. La página carga, pero no se comprobó que siga animando: probarlo esta semana sí o sí. Dibujos sin nombre y nunca fotos de niños."}, {"id": "v3-B2", "rep": "v3", "code": "B2", "group": "B · Máquinas que aprenden (más allá del Teachable Machine básico)", "name": "El robot de vasos que aprende a ganar (MENACE)", "top": true, "what": "Un «cerebro» hecho de vasos de papel con pompones de colores juega a un juego muy simple contra los niños (por ejemplo, coger una o dos fichas; quien coge la última pierde). Cuando pierde le quitan un pompón y cuando gana le dan uno. Tras unas pocas partidas, los vasos empiezan a ganar a la clase.", "why": "Unos vasos les ganan, y los han entrenado ellos. Así se entiende de verdad qué es «aprender» para una máquina.", "sci": "Es aprendizaje por refuerzo: la IA aprende con premios y castigos, no con reglas.", "src": "Hannah Fry y Matt Parker, Christmas Lectures 2019 de la Royal Institution — mscroggs.co.uk/blog/71 · rigb.org (Secrets and lies)", "time": "12 min", "mat": "Vasos de papel, pompones o botones, pegatinas (bazar)", "note": "Las tres en raya del original es demasiado grande para 6 años: usar un juego mínimo."}, {"id": "v3-B3", "rep": "v3", "code": "B3", "group": "B · Máquinas que aprenden (más allá del Teachable Machine básico)", "name": "Teachable Machine con gracia: peluches, sonidos y el perro blanco", "top": true, "what": "Variantes con más gracia que «brazos arriba». La clase le enseña sus peluches y luego intenta engañarla. Modo sonido: toda la clase le enseña aplausos, «¡miau!» y silencio. Revelación del sesgo: solo le enseñaste perros marrones y no reconoce al perro blanco, así que la pregunta es qué se olvidaron de enseñarle. Con Stretch3, un aplauso hace saltar al gato de Scratch.", "why": "Son los profes de la máquina, y el fallo del perro blanco es un momento de revelación.", "sci": "«Nosotros le dimos 30 ejemplos. Yo le doy millones de ARN, y si le doy de un solo tipo se confunde igual.»", "src": "Google, teachablemachine.withgoogle.com · Stretch3 (Scratch con extensión de Teachable Machine), stretch3.champierre.com", "time": "15–20 min", "mat": "Portátil con cámara y micrófono", "note": "Procesa en el navegador. No pulsar «guardar». Mejor objetos y sonidos que caras."}, {"id": "v3-B4", "rep": "v3", "code": "B4", "group": "B · Máquinas que aprenden (más allá del Teachable Machine básico)", "name": "¿Lo hizo un niño o una máquina?", "top": false, "what": "Se proyectan parejas de dibujos: uno lo hizo un niño de otra clase, recogido antes por la profe, y otro una IA. Los niños votan moviéndose a un lado u otro del aula.", "why": "Votar con el cuerpo y adivinar. Les encanta acertar contra la máquina.", "sci": "¿Cómo sabemos lo que una máquina «sabe»? Es la pregunta de Turing.", "src": "Mike Wooldridge, Christmas Lectures 2023 «The Truth about AI» (juego de la imitación, robot pintora Ai-Da) — rigb.org/node/5525", "time": "8 min", "mat": "Diapositivas", "note": "Un minuto del vídeo de Ai-Da pintando es buen gancho."}, {"id": "v3-B5", "rep": "v3", "code": "B5", "group": "B · Máquinas que aprenden (más allá del Teachable Machine básico)", "name": "Scroobly: un garabato que se mueve como tú", "top": false, "what": "Un dibujo en la pantalla copia tus movimientos por la cámara. Mejor que lo hagas tú y que la clase te dirija («¡levanta los brazos!», «¡salta!»).", "why": "Mandar al adulto y verlo convertido en dibujo animado.", "sci": "La IA encuentra 17 puntos en un cuerpo. Tú encuentras los puntos que se emparejan en un ARN.", "src": "Google Creative Lab, scroobly.com", "time": "5–10 min", "mat": "Webcam, internet", "note": "Alternativa si falla: Pose Animator (pose-animator-demo.firebaseapp.com)."}, {"id": "v3-B6", "rep": "v3", "code": "B6", "group": "B · Máquinas que aprenden (más allá del Teachable Machine básico)", "name": "Blob Opera: la ópera de las gotas", "top": false, "what": "Cuatro gotas cantan ópera y armonizan solas. La clase dirige gritando «¡arriba!» o «¡abajo!».", "why": "Les parece desternillante. Sin cámara ni datos personales.", "sci": "La IA aprendió de grabaciones de cantantes qué suena bien junto. Patrones otra vez.", "src": "David Li para Google Arts & Culture — artsandculture.google.com/experiment/blob-opera/AAHWrq360NcGbw", "time": "5 min", "mat": "Portátil, altavoces", "note": "Buena para abrir o para calmar."}, {"id": "v3-B7", "rep": "v3", "code": "B7", "group": "B · Máquinas que aprenden (más allá del Teachable Machine básico)", "name": "El intruso: la clase contra la IA (Odd One Out)", "top": false, "what": "Salen cuatro objetos y la clase vota a mano alzada cuál es el que no encaja, contra la IA.", "why": "Votación de 45 a la vez, y competición.", "sci": "Encontrar el raro es exactamente cómo buscas ARN nuevos o extraños.", "src": "Google Arts & Culture — artsandculture.google.com/experiment/wAHNn4JsVTFOiw", "time": "5–10 min", "mat": "Portátil, internet", "note": ""}, {"id": "v3-B8", "rep": "v3", "code": "B8", "group": "B · Máquinas que aprenden (más allá del Teachable Machine básico)", "name": "Nuestra criatura, dibujada por la IA", "top": false, "what": "La clase grita las partes de una criatura («una jirafa con alas de mariposa y zapatos rojos»), tú las escribes y aparece la imagen. Después se pregunta si es lo que imaginaban y en qué se equivocó.", "why": "Ver su idea hecha imagen en segundos. Es lo que contarán en casa.", "sci": "La IA genera a partir de patrones aprendidos. Contar las patas: ¿lo hizo bien?", "src": "Generadores de imagen operados por un adulto (Gemini, ChatGPT, Firefly) · Google «Say What You See» como versión guiada", "time": "5–10 min", "mat": "Tu cuenta de adulto, internet", "note": "Solo lo maneja el adulto (los servicios son para mayores de 13). Probar los prompts antes. Nunca fotos de niños."}, {"id": "v3-B9", "rep": "v3", "code": "B9", "group": "B · Máquinas que aprenden (más allá del Teachable Machine básico)", "name": "Engaña al coche robot", "top": false, "what": "Se enseña el clip del coche que choca contra una pared pintada como el Correcaminos. Luego ellos son la «cámara» mirando por un tubo con un ojo: ¿es una foto de una puerta o una puerta de verdad?", "why": "Lógica de dibujos animados y una máquina de adultos engañada.", "sci": "Las IA se equivocan si solo tienen un tipo de dato; por eso se combinan muchos datos.", "src": "Mark Rober, «Can You Fool A Self Driving Car?» — youtube.com/watch?v=IQJL3htsDyQ", "time": "10 min", "mat": "Tubos de cartón, fotos impresas, un coche de juguete", "note": ""}, {"id": "v3-B10", "rep": "v3", "code": "B10", "group": "B · Máquinas que aprenden (más allá del Teachable Machine básico)", "name": "¿Le pegarías a un robot?", "top": false, "what": "Presentas un robot de juguete o un Hexbug, la clase le pone nombre, y preguntas: ¿está bien gritarle? ¿tirarlo? Votan. Luego: ¿siente? ¿por qué nos da pena?", "why": "Los dilemas morales fascinan a los 6–7 años.", "sci": "Una máquina que parece viva no está viva. ¿Qué es estar vivo? (currículo 1.2.1)", "src": "Kate Darling, TED «Why we have an emotional connection to robots» — ted.com/speakers/kate_darling", "time": "6 min", "mat": "Cualquier robot o juguete que se mueva", "note": "No enseñar el vídeo del hacha. Contarlo con suavidad."}, {"id": "v3-C1", "rep": "v3", "code": "C1", "group": "C · Luz, vida y forma", "name": "Las bacterias que votan y se encienden", "top": true, "what": "Luces apagadas. Cada niño es una bacteria con una pulsera luminosa o una lucecita apagada. Se pasan una «molécula» (una pelota blanda o un susurro). Cuando hay «suficientes», toda la clase se enciende a la vez. Con solo tres niños, no hay luz. Antes, un minuto de vídeo del calamar que brilla gracias a sus bacterias.", "why": "Oscuridad, luz, y los 45 participan a la vez. Es el momento mágico del día.", "sci": "Las células «hablan» con moléculas y los genes se encienden todos juntos: así se regula el ARN.", "src": "Bonnie Bassler, TED «How bacteria talk» — ed.ted.com/lessons/how-bacteria-talk-bonnie-bassler · Edith Widder, TED bioluminiscencia — ted.com/talks/edith_widder_the_weird_wonderful_world_of_bioluminescence", "time": "10 min", "mat": "Pulseras luminosas o luces LED de dedo (bazar, tienda de fiestas)", "note": "Mejor LED de dedo que barras químicas: el líquido irrita si las muerden."}, {"id": "v3-C2", "rep": "v3", "code": "C2", "group": "C · Luz, vida y forma", "name": "El papel que se dobla solo (plegamiento de ARN)", "top": true, "what": "Cada grupo tiene una tira larga con pegatinas de colores. Los colores que hacen pareja tienen que tocarse, así que la tira se dobla en horquillas y lazos. Cada grupo acaba con una forma secreta distinta, que sale solo del orden de los colores. Antes, 30 segundos de animación de proteínas plegándose.", "why": "Manual, sorprendente, y cada forma es diferente.", "sci": "Es literalmente tu trabajo: el orden de las letras decide la forma, y tu IA busca formas parecidas.", "src": "Inspirado en las animaciones de AlphaFold (DeepMind) y en tu propia investigación", "time": "10 min", "mat": "Tiras de papel, pegatinas de 4 colores", "note": "Es el puente más directo con lo que haces."}, {"id": "v3-C3", "rep": "v3", "code": "C3", "group": "C · Luz, vida y forma", "name": "Robots que bailan: ¿quién les enseñó?", "top": false, "what": "Un minuto de robots bailando como apertura o cierre. Pregunta: ¿quién les enseñó a bailar? ¿lo saben ellos?", "why": "Enganche inmediato.", "sci": "Las máquinas hacen lo que aprendieron de datos o de instrucciones.", "src": "Boston Dynamics, «Do You Love Me?» (dic. 2020), YouTube", "time": "2 min", "mat": "Proyector", "note": "Solo como gancho."}, {"id": "v3-D1", "rep": "v3", "code": "D1", "group": "D · Nadie es como tú (heredero del árbol de rasgos)", "name": "Detectives de huellas dactilares", "top": true, "what": "Cada niño saca su huella con tampón o con lápiz blando y celo, la mira con lupa o ampliada en el proyector, y la clasifica: lazo, remolino o arco. La pega en un gran gráfico de la clase. Nadie tiene la misma, ni siquiera los gemelos.", "why": "Su dedo tiene un dibujo secreto que nadie más en el mundo tiene. Y les dan una «placa» de detective.", "sci": "El gráfico son datos reales. Los móviles y la policía comparan huellas con algoritmos que buscan los puntos donde las líneas se cortan o se acaban.", "src": "Unquowa School (1º primaria) — unquowa.org/fantastic-fingerprints/ · Science Foundation Ireland (método lápiz y celo) — sfi.ie (Curious Minds, Investigating fingerprints)", "time": "15–20 min", "mat": "Tampón lavable o lápiz 4B, celo, lupas, toallitas", "note": "Las huellas se quedan en papel y se las llevan: «tu huella es tu llave secreta»."}, {"id": "v3-D2", "rep": "v3", "code": "D2", "group": "D · Nadie es como tú (heredero del árbol de rasgos)", "name": "Encuentra la misma ballena (juega a ser el ordenador)", "top": true, "what": "Cada mesa recibe unas ocho fotos de colas de ballena y tiene que encontrar las dos que son la misma ballena. Después, en el proyector, el ordenador lo hace en un segundo.", "why": "Ballenas, un juego de parejas, y ganar o perder contra el ordenador.", "sci": "El ordenador mira las mismas pistas que ellos. Es exactamente cómo un bioinformático compara patrones.", "src": "Happywhale: IA que identifica ballenas por la cola, más de 64.000 individuos — highnorthnews.com (citizen science AI whales) · artículo en cascadiaresearch.org", "time": "10–15 min", "mat": "Fotos impresas", "note": "Comprobar la licencia de las fotos."}, {"id": "v3-D3", "rep": "v3", "code": "D3", "group": "D · Nadie es como tú (heredero del árbol de rasgos)", "name": "El mapa de estrellas del tiburón ballena", "top": false, "what": "Unen con rotulador los puntos de un tiburón como si fuera una constelación y la comparan con la del compañero.", "why": "«El truco que encuentra estrellas encuentra tiburones.»", "sci": "Un patrón convertido en números: distancias entre puntos.", "src": "El algoritmo que identifica tiburones ballena viene de la astronomía (telescopio Hubble), con más de 6.000 tiburones identificados — scientificamerican.com (Astronomy tool helps ID sharks)", "time": "10 min", "mat": "Fotos impresas, rotuladores", "note": "Combina con D2."}, {"id": "v3-D4", "rep": "v3", "code": "D4", "group": "D · Nadie es como tú (heredero del árbol de rasgos)", "name": "Las jirafas bebé heredan las manchas de mamá", "top": false, "what": "Emparejan jirafas bebé con su madre por la forma de las manchas. Descubren que se parecen pero nunca son iguales.", "why": "Herencia explicada sin usar sus propias familias.", "sci": "Genes más un poco de azar. Encaja con tu mensaje: la receta está escrita, pero no sale una copia exacta.", "src": "Lee et al. 2018, PeerJ — peerj.com/articles/5690 · versión para niños en snexplores.org · Microsoft y la identificación de jirafas con IA (2025)", "time": "10 min", "mat": "Fotos impresas", "note": "Mucho mejor que fotos de bebés de los niños (ver lo descartado)."}, {"id": "v3-D5", "rep": "v3", "code": "D5", "group": "D · Nadie es como tú (heredero del árbol de rasgos)", "name": "El código de barras de la clase", "top": true, "what": "Cada niño colorea una tira de cinco o seis cuadros según sus rasgos (pulgar cruzado, pecas, rizos…). Juntas, las tiras forman el «código de barras» de la clase. Luego buscan dos tiras iguales y casi nunca las hay.", "why": "Mantiene el espíritu de las hojas del árbol, sin escribir nada.", "sci": "Parece una lectura de ADN o un mapa de calor: lo que de verdad mira un bioinformático en la pantalla.", "src": "Extensión de las olas de rasgos · Science Museum «Who am I?» (7–11 años)", "time": "15 min", "mat": "Tiras impresas, ceras", "note": "Evitar rasgos que puedan dar burlas (peso, piel)."}, {"id": "v3-D6", "rep": "v3", "code": "D6", "group": "D · Nadie es como tú (heredero del árbol de rasgos)", "name": "Olas de rasgos y aros de Venn", "top": false, "what": "«Levántate si…» en ola. Después, dos aros en el suelo (pulgar izquierdo arriba, pecas) con una zona en medio. Se colocan y se convierten en el gráfico.", "why": "Se mueven y se ven convertidos en datos.", "sci": "La clase es el conjunto de datos: «nadie está exactamente en los mismos aros que tú».", "src": "OISE Toronto, Venn con aros para 6–9 años — oise.utoronto.ca/robertson/lesson-plans/introduction-venn-diagrams", "time": "10 min", "mat": "Aros o cuerdas", "note": "Enrollar la lengua no es un rasgo genético simple: presentarlo como «diferente», no como «el gen de…»."}, {"id": "v3-D7", "rep": "v3", "code": "D7", "group": "D · Nadie es como tú (heredero del árbol de rasgos)", "name": "Haz tu cebra (patrones de Turing)", "top": false, "what": "Ven en el proyector cómo una simulación hace crecer manchas y rayas solas. Luego cada niño dibuja «su» cebra, y no hay dos iguales.", "why": "Magia visual, y algo que se llevan.", "sci": "Una receta simple más el azar dan resultados únicos: la misma idea de «tu ADN está escrito, pero cómo se lee cambia».", "src": "Alan Turing (1952) — popsci.com (animal patterns Turing) · simulador de Karl Sims, karlsims.com/rd.html", "time": "10–15 min", "mat": "Siluetas de cebra, rotuladores", "note": "Comprobar que el simulador va fluido en el portátil del aula."}, {"id": "v3-D8", "rep": "v3", "code": "D8", "group": "D · Nadie es como tú (heredero del árbol de rasgos)", "name": "Cilantro: ¿rico o sabe a jabón?", "top": false, "what": "Huelen hoja de cilantro aplastada, solo oler, y votan con el pulgar.", "why": "Reacciones de cara muy divertidas.", "sci": "Hay un gen del olfato, pero los genes explican solo una parte: encaja con tu mensaje final.", "src": "Estudio de 23andMe, variante cerca del gen del olfato OR6A2 — arxiv.org/pdf/1209.2096", "time": "5 min", "mat": "Cilantro del súper", "note": "Solo oler. Preguntar alergias a la profe."}, {"id": "v3-D9", "rep": "v3", "code": "D9", "group": "D · Nadie es como tú (heredero del árbol de rasgos)", "name": "Dollar Street: ¿qué tienen todos los niños del mundo?", "top": false, "what": "Fotos reales de cepillos de dientes, camas o juguetes de casas de todo el mundo. ¿Cuál es de España? ¿Qué tienen todas las familias?", "why": "Juguetes y camas de niños reales, y buscar parecidos.", "sci": "Buscar patrones y agrupar.", "src": "Gapminder (Hans Rosling) — gapminder.org/dollar-street", "time": "7 min", "mat": "Web", "note": "No ordenar por «ricos y pobres» a esta edad: centrarlo en lo que se parece."}, {"id": "v4-BASE", "rep": "v4", "code": "Base", "group": "Perro del ADN · base", "name": "El perro del ADN (versión base, 4 gomets)", "top": true, "what": "Cada niño recibe una tira con 4 gomets de colores (cuerpo, orejas, cola, pelo), busca en la tabla qué le toca y dibuja o pega su perro. 256 perros posibles.", "why": "Es la actividad que encantó a tus hijos, simplificada: colores en vez de símbolos.", "sci": "El ADN es una receta escrita en 4 letras.", "src": "Tu presentación «¿Cómo el ADN nos hace únicos?»", "time": "15-20 min", "mat": "Gomets, tiras, tablas impresas, rotuladores", "note": ""}, {"id": "v4-V1", "rep": "v4", "code": "V1", "group": "Perro del ADN · variantes", "name": "Gemelos secretos", "top": true, "what": "Sin decirlo, das a dos niños de mesas distintas exactamente el mismo código. Al colgar los perros, alguien descubre que hay dos iguales. «¿Os habéis copiado?» No: tenían la misma receta.", "why": "La revelación es suya: ellos encuentran a los gemelos. Es el momento Mark Rober de la actividad.", "sci": "Misma receta, mismo perro: los gemelos idénticos tienen el mismo ADN.", "src": "", "time": "+3 min", "mat": "Nada extra", "note": ""}, {"id": "v4-V2", "rep": "v4", "code": "V2", "group": "Perro del ADN · variantes", "name": "La mutación", "top": true, "what": "Se proyecta un perro y su tira. Cambias un solo gomet («¡oh no, una errata!») y la clase grita qué parte del perro cambia. Luego cada niño puede cambiar un gomet de su tira y dibujar el perro mutante al lado.", "why": "Lo prohibido divierte: estropear la receta a propósito. Y el antes y después se ve.", "sci": "Un cambio de una letra cambia el animal. Es exactamente lo que buscas tú en el ordenador.", "src": "", "time": "5 min", "mat": "Gomets sueltos", "note": ""}, {"id": "v4-V3", "rep": "v4", "code": "V3", "group": "Perro del ADN · variantes", "name": "El mensajero (tu ARN)", "top": true, "what": "El «libro del ADN» con todos los códigos se queda en la mesa del profe, que es el núcleo, y no puede salir de ahí. Cada niño va, copia su tira en un papelito (el ARN mensajero) y lo lleva a su mesa, que es la fábrica donde se construye el perro.", "why": "Les da un rol con movimiento (ir, copiar, volver) y una regla de juego: el libro no se toca.", "sci": "El ADN se guarda; lo que viaja es una copia en ARN. Es tu campo, y lo explica sin palabras.", "src": "", "time": "+5 min", "mat": "Un cuaderno o carpeta grande como «libro», tiras en blanco", "note": ""}, {"id": "v4-V4", "rep": "v4", "code": "V4", "group": "Perro del ADN · variantes", "name": "Mamá perro + papá perro = cachorro", "top": false, "what": "Cada niño recibe dos tiras, la de la mamá y la del papá. Para cada gen tira una moneda: cara copia el gomet de mamá, cruz el de papá. Luego dibuja el cachorro. Los de la misma mesa, con los mismos padres, comparan: son hermanos, se parecen pero no son iguales.", "why": "La moneda les engancha y el «¿por qué mi hermano tiene otras orejas?» sale solo.", "sci": "Herencia: la mitad de cada uno. Es el puente directo con el árbol de rasgos de tus hijos.", "src": "", "time": "12 min", "mat": "Monedas o un dado, dos tiras por niño", "note": ""}, {"id": "v4-V5", "rep": "v4", "code": "V5", "group": "Perro del ADN · variantes", "name": "Detectives del ADN (al revés)", "top": false, "what": "En lugar de leer el código y dibujar, les enseñas un perro ya dibujado y tienen que adivinar qué gomets lo hicieron, mirando la tabla. Puede ser un juego de toda la clase con la pizarra.", "why": "Es un acertijo y lo resuelven gritando. Funciona muy bien de cierre rápido.", "sci": "Bioinformática: a partir de lo que vemos, averiguar qué dice el código.", "src": "", "time": "5 min", "mat": "3-4 perros dibujados y proyectados", "note": ""}, {"id": "v4-V6", "rep": "v4", "code": "V6", "group": "Perro del ADN · variantes", "name": "¿Hay dos perros iguales en la clase?", "top": false, "what": "Si los códigos salen al azar (bolsa de gomets o dado), con 4 genes hay 256 perros posibles y aun así, con 45 niños, casi seguro aparecen dos iguales. Cálculo hecho: un 98 % de probabilidad (60 % con 22 niños). Con 5 genes (1024 perros) baja al 63 %. Les preguntas antes «¿saldrán dos iguales?» y casi todos dicen que no.", "why": "Apuesta de clase, y luego la búsqueda de parejas entre los perros colgados.", "sci": "La «paradoja del cumpleaños»: las coincidencias son más fáciles de lo que parecen. Ciencia de datos de verdad.", "src": "", "time": "+5 min", "mat": "Gomets en una bolsa opaca", "note": ""}, {"id": "v4-V7", "rep": "v4", "code": "V7", "group": "Perro del ADN · variantes", "name": "La manada en un gráfico", "top": false, "what": "Cuelgas todos los perros en la pizarra agrupados por orejas (o cola). Se forma solo un gráfico de barras hecho de perros. «¿Qué oreja ganó?» Se puede repetir agrupando por otro gen.", "why": "Ven su dibujo formar parte de algo grande.", "sci": "Encontrar patrones en muchos datos: lo que haces tú con miles de genes.", "src": "", "time": "5 min", "mat": "Cinta adhesiva o masilla", "note": ""}, {"id": "v4-V8", "rep": "v4", "code": "V8", "group": "Perro del ADN · variantes", "name": "El ADN gigante", "top": false, "what": "Su tira del perro tiene 4 gomets. Desenrollas un rollo de papel de cocina o de caja registradora larguísimo, lleno de gomets, que cruza el aula. «Esto es solo un trocito del vuestro.» Recupera la diapositiva de «El problema… ¡el tamaño!» de tu presentación.", "why": "El rollo atravesando la clase es visual y físico.", "sci": "Por eso hacen falta ordenadores para leer el ADN: tu trabajo.", "src": "", "time": "3 min", "mat": "Un rollo de papel y gomets (o puntos con rotulador)", "note": ""}, {"id": "v4-V9", "rep": "v4", "code": "V9", "group": "Perro del ADN · variantes", "name": "El interruptor (epigenética para peques)", "top": false, "what": "Cada niño tiene un post-it pequeño: puede tapar UN gen y elegir que ese no se lea (el perro sale sin cola, o con la cola de serie). La receta no cambia, solo qué parte se lee.", "why": "Recupera tu mensaje final («ustedes ayudan a decidir qué partes leer») con algo que pueden tocar.", "sci": "Epigenética: el mismo ADN, distintas partes encendidas.", "src": "", "time": "3 min", "mat": "Post-its pequeños", "note": ""}, {"id": "v4-IA1", "rep": "v4", "code": "IA1", "group": "Perro del ADN · con IA", "name": "Tú preparas las piezas con IA (antes de clase)", "top": true, "what": "Generas con una IA de imagen las ilustraciones de la tabla (4 cuerpos, 4 orejas, 4 colas…) en un estilo uniforme, «dibujo para colorear, línea negra, fondo blanco». Para 1º puedes imprimir las piezas para recortar y pegar en lugar de dibujar desde cero.", "why": "Las tablas quedan bonitas y coherentes, y los que no se atreven a dibujar también terminan su perro.", "sci": "", "src": "", "time": "", "mat": "", "note": "Gemini, ChatGPT o la IA que uses; pide variantes hasta que encajen entre sí."}, {"id": "v4-IA2", "rep": "v4", "code": "IA2", "group": "Perro del ADN · con IA", "name": "Del dibujo al perro «de verdad»", "top": true, "what": "Fotografías 3-4 dibujos (sin caras ni nombres de niños) y la IA los convierte en un perro realista, de peluche o de película animada, manteniendo sus rasgos. Se proyecta el dibujo al lado de su versión. Si no da tiempo en clase, haces los de todos después y la profe los muestra otro día como «la manada».", "why": "Es el «wow» más seguro de la lista: su dibujo se convierte en algo que parece real.", "sci": "", "src": "", "time": "", "mat": "", "note": "Gemini o ChatGPT con la foto y algo como «convierte este dibujo de niño en un perro realista; respeta exactamente las orejas, la cola y las manchas». Ensaya el prompt en casa con dibujos de tus hijos."}, {"id": "v4-IA3", "rep": "v4", "code": "IA3", "group": "Perro del ADN · con IA", "name": "La IA como ribosoma: ¿leyó bien el código?", "top": true, "what": "Le das a la IA, delante de ellos, la tabla y una tira («rojo, azul, verde, amarillo») y le pides que dibuje el perro. Los niños, que ya saben leer la tabla, comprueban si la máquina se equivocó: ¿tiene las orejas caídas? ¿y la cola rizada? Si falla, mejor todavía.", "why": "Los pone en el papel de expertos que corrigen a la máquina.", "sci": "", "src": "", "time": "", "mat": "", "note": "Mensaje para el final: las máquinas ayudan mucho, pero alguien tiene que revisar. Eso es parte de tu trabajo."}, {"id": "v4-IA4", "rep": "v4", "code": "IA4", "group": "Perro del ADN · con IA", "name": "El perro mutante dibujado por la IA", "top": false, "what": "Combinación con V2: la IA dibuja el perro original y luego el mismo perro con un solo gen cambiado. Se proyecta como un «antes y después».", "why": "Se ve muy claro qué cambió y qué se quedó igual.", "sci": "", "src": "", "time": "", "mat": "", "note": "Pide en la misma conversación «el mismo perro, igual en todo, pero con las orejas de punta» para mantener el estilo."}, {"id": "v4-IA5", "rep": "v4", "code": "IA5", "group": "Perro del ADN · con IA", "name": "¿Adivina la máquina que es un perro?", "top": false, "what": "Un voluntario dibuja su perro en Quick, Draw! (quickdraw.withgoogle.com) en la pantalla y la IA intenta adivinar qué es. Con orejas gigantes y cola de plumero quizá diga «gato» o «zorro».", "why": "Gracioso y rápido. Sirve de enlace con las ideas de máquinas que aprenden del informe anterior.", "sci": "", "src": "", "time": "", "mat": "", "note": "Comprueba que sigue funcionando y que «perro» está entre sus categorías."}, {"id": "v4-IA6", "rep": "v4", "code": "IA6", "group": "Perro del ADN · con IA", "name": "Perros que se mueven", "top": false, "what": "Animated Drawings (sketch.metademolab.com) anima dibujos, pero está pensado para figuras de pie, con brazos y piernas. Un perro de cuatro patas probablemente no se anime bien; un perro dibujado de pie, como un personaje, puede funcionar y ser muy gracioso.", "why": "Si funciona, es lo que más gritos provoca.", "sci": "", "src": "", "time": "", "mat": "", "note": "No lo verifiqu const REP = {v2:"Informe v2", v3:"Informe v3", v4:"Informe v4"};
let dec = {};           // id -> {d, note}
let filter = "all";
let db = null;
const $ = s => document.querySelector(s);

function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) { if (k==="text") e.textContent=v; else e.setAttribute(k,v); }
  kids.forEach(k => k && e.append(k));
  return e;
}

function counts(){
  const v = Object.values(dec).map(x=>x.d);
  $("#nSi").textContent = v.filter(x=>x==="si").length;
  $("#nQz").textContent = v.filter(x=>x==="quizas").length;
  $("#nNo").textContent = v.filter(x=>x==="no").length;
  $("#nPend").textContent = IDEAS.filter(i=>!dec[i.id]?.d).length;
}

function visible(i){
  const d = dec[i.id]?.d;
  if (filter==="pend") return !d;
  if (filter==="si" || filter==="quizas") return d===filter;
  if (filter==="top") return i.top;
  return true;
}

function card(i){
  const d = dec[i.id]?.d || "";
  const c = el("article",{class:"card","data-d":d,"data-id":i.id});
  const top = el("div",{class:"top"}, el("span",{class:"code",text:i.code}),
    el("span",{class:"name",text:i.name}));
  if (i.top) top.querySelector(".name").append(el("span",{class:"star",text:" ★","aria-label":"favorita"}));
  c.append(top, el("p",{class:"what",text:i.what}));
  const meta = el("div",{class:"meta"});
  [REP[i.rep], i.time && "⏱ "+i.time, i.mat && "Material: "+i.mat].filter(Boolean).forEach(t=>meta.append(el("span",{text:t})));
  c.append(meta);
  const more = [["Por qué engancha",i.why],["La ciencia",i.sci],["Fuente",i.src],["Ojo",i.note]].filter(x=>x[1]);
  if (more.length){
    const det = el("details",{}, el("summary",{text:"Más detalle"}));
    more.forEach(([k,v])=>{ const p=el("p"); p.append(el("b",{text:k+": "}), v); det.append(p); });
    c.append(det);
  }
  const vote = el("div",{class:"vote"});
  [["si","Sí"],["quizas","Quizás"],["no","No"]].forEach(([v,l])=>{
    const b = el("button",{type:"button","data-v":v,"aria-pressed":String(d===v),id:`b-${i.id}-${v}`});
    b.append(el("i",{class:"dot",style:`background:var(--${v==="quizas"?"qz":v})`}), l);
    b.onclick = () => setDec(i.id, d===v ? "" : v);
    vote.append(b);
  });
  c.append(vote);
  const note = el("input",{class:"note",id:`n-${i.id}`,placeholder:"Nota (opcional)",value:dec[i.id]?.note||""});
  note.addEventListener("change", ()=> save(i.id, {d: dec[i.id]?.d||"", note: note.value.trim()}));
  c.append(note);
  return c;
}

function render(){
  const list = $("#list"); list.replaceChildren();
  const groups = [...new Set(IDEAS.map(i=>i.group))];
  for (const g of groups){
    const items = IDEAS.filter(i=>i.group===g && visible(i));
    if (!items.length) continue;
    const h = el("h2",{text:g}); h.append(el("small",{text:`${items.length} ideas`}));
    const grid = el("div",{class:"grid"}); items.forEach(i=>grid.append(card(i)));
    list.append(h, grid);
  }
  if (!list.children.length) list.append(el("p",{class:"lede",text:"No hay ideas con este filtro."}));
  counts();
}

function setDec(id, d){ save(id, {d, note: dec[id]?.note || ""}); }

async function save(id, val){
  dec[id] = val; render();
  try { localStorage.setItem("dc-dec", JSON.stringify(dec)); } catch(e){}
  if (!db) return;
  try { await db.doc("decisions/"+id).set({...val, at: Date.now()}); $("#status").textContent = "Guardado. Claude puede leer tus elecciones."; }
  catch(e){ $("#status").textContent = "No se pudo guardar en línea ("+(e.code||e.message)+"). Queda guardado solo en este navegador."; }
}

document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  render();
});

try { dec = JSON.parse(localStorage.getItem("dc-dec")||"{}"); } catch(e){ dec = {}; }
render();

(async()=>{
  const timer = setTimeout(()=>{ if(!db) $("#status").textContent="Sin conexión al guardado en línea: tus elecciones quedan solo en este navegador."; }, 10000);
  db = await window.claude?.use?.("db") ?? null;
  if (!db){ clearTimeout(timer); $("#status").textContent="Sin guardado en línea (¿sesión cerrada?): tus elecciones quedan solo en este navegador."; return; }
  db.collection("decisions").onSnapshot(snap=>{
    clearTimeout(timer);
    const docs = snap.docs || snap;
    docs.forEach(d=>{ const v = d.data ? d.data() : d; const id = d.id; if (id) dec[id] = {d:v.d||"", note:v.note||""}; });
    if (document.activeElement?.classList?.contains("note")) counts(); else render();
    $("#status").textContent = "Guardado en línea activo: Claude puede leer tus elecciones.";
  }, err=>{ clearTimeout(timer); $("#status").textContent="No se pudo leer el guardado en línea; uso este navegador."; });
})();
</script>
