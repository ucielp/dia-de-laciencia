<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Científicos por un día</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;700;800&display=swap">
<style>
/* Layout: un escenario fijo de 1920x1080 escalado a la pantalla (proyector), barra mínima abajo y panel de guion que se abre con N. */
:root{
  --blue:#29ABE2; --orange:#F7931E; --green:#7AC143; --grey:#6D6E71;
  --ink:#1F2A44; --inkSoft:#4A5265; --paper:#FFFDF7; --cream:#F6F1E6; --sand:#EFE5D2;
  --red:#E04B3A; --gblue:#2453C7; --yellow:#F2C230; --pink:#E59AAE;
  --bg:#141824; --chrome:#1F2433; --chromeInk:#C9D3E8;
  --display:"Fredoka",ui-rounded,system-ui,sans-serif;
  --body:"Nunito Sans",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#viewport{position:relative;flex:1;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--paper);overflow:hidden;border-radius:6px}
.scene{position:absolute;inset:0;animation:sceneIn .45s ease both}
.scene.leaving{animation:sceneOut .35s ease both;pointer-events:none}
@keyframes sceneIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes sceneOut{to{opacity:0}}
.err{position:absolute;left:80px;top:80px;font-size:40px;color:var(--red)}
#bar{flex:none;height:46px;display:flex;align-items:center;gap:10px;padding-inline:max(12px,env(safe-area-inset-left,0px));background:var(--chrome);color:var(--chromeInk);font-size:14px}
#bar button{font:inherit;color:var(--chromeInk);background:transparent;border:1px solid #39415a;border-radius:999px;padding:4px 12px;cursor:pointer}
#bar button:hover{background:#2a3146}
#bar button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#bar button[aria-pressed="true"]{background:#39415a}
#dots{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;min-width:0}
#dots .dot{width:12px;height:12px;padding:0;border-radius:50%;background:#39415a;border:none}
#dots .dot.on{background:var(--orange)}
#where{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.keys{opacity:.6;white-space:nowrap}
@media (max-width:760px){.keys{display:none}}
#notes{position:absolute;right:12px;top:12px;bottom:12px;width:min(460px,90vw);overflow:auto;background:#FFFDF7;color:#1F2A44;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.45);padding:18px 20px;font-size:16px;line-height:1.5;z-index:5}
#notes h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 8px}
#notes p{margin:0 0 10px}
@media (prefers-reduced-motion:reduce){.scene,.scene.leaving{animation:none}}
/* Solo móvil en vertical (core.js añade .rot a <html>): la presentación se muestra girada 90° para ocupar toda la pantalla.
   En ordenador y proyector esta clase nunca se pone, así que nada de esto aplica. */
html.rot #app{inset:auto;top:0;left:0;transform:rotate(90deg) translateY(-100%);transform-origin:0 0}
#turnHint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;background:#FFFDF7;color:#1F2A44;font:600 17px/1.3 var(--display);padding:12px 18px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.45);white-space:nowrap;transition:opacity .6s}
#turnHint.off{opacity:0;pointer-events:none}
/* Fondo celeste claro para todas las escenas de contenido (antes crema). Los separadores de actividad y la portada con foto mantienen su color. */
.rc,.fp,.cb,.lb,.ci,.po,.eq,.par-bg,.bf-bg,.ar-bg,.fx,.mc,.ns,.am,.mt,.fp-end,.vd,.gr,.kr{background:linear-gradient(160deg,#F2F8FD,#DCEAF6)!important}
/* Móvil (táctil y pequeño): barra compacta. En ordenador (ratón) no aplica. */
@media (pointer:coarse) and (max-height:500px),(pointer:coarse) and (max-width:500px){#notesBtn,.keys{display:none}#bar button{white-space:nowrap}}
</style>

<div id="app">
  <div id="viewport">
    <div id="stage" aria-live="polite"></div>
    <aside id="notes" hidden></aside>
  </div>
  <nav id="bar" aria-label="Controles">
    <button id="prev" aria-label="Anterior">◀</button>
    <button id="next" aria-label="Siguiente">▶</button>
    <div id="dots"></div>
    <span id="where"></span>
    <button id="notesBtn">Guion (N)</button>
    <button id="mute" aria-pressed="false">Sonido (M)</button>
    <button id="fullBtn">Pantalla completa (F)</button>
    <span class="keys">← → para avanzar</span>
  </nav>
</div>

<script src="core.js"></script>
<script src="data/notes.js"></script>
<script src="art/species.js"></script>
<script src="data/tree.js"></script>
<script src="scenes/portada.js"></script>
<script src="scenes/grupo.js"></script>
<script src="scenes/kresko.js"></script>
<script src="scenes/ciencia.js"></script>
<script src="scenes/perro.js"></script>
<script src="scenes/familia.js"></script>
<script src="scenes/cierre.js"></script>
<script src="scenes/video.js"></script>
